plugins {
    id 'com.android.application'
}

// Release signing secrets live outside git, in keystore.properties at the project root.
def ks = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.linkguard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.linkguard'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    signingConfigs {
        release {
            storeFile ks.storeFile ? file(ks.storeFile) : null
            storePassword ks.storePassword
            keyAlias ks.keyAlias
            keyPassword ks.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    testImplementation 'junit:junit:4.13.2'
}
